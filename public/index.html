<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Circuit Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #login-panel, #game-ui { display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; background: #222; padding: 20px; border-radius: 8px; }
        #game-ui { display: none; }
        input, button { padding: 10px; font-size: 16px; border-radius: 4px; border: none; }
        button { background: #28a745; color: white; cursor: pointer; }
        button.admin-btn { background: #d9534f; }
        #admin-panel { margin-top: 15px; padding: 10px; border: 1px solid #d9534f; border-radius: 4px; display: none; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>

    <div id="login-panel">
        <h2>Circuit Runner Login</h2>
        <input type="text" id="username-input" placeholder="Enter Username (e.g. Hurtrain)">
        <button onclick="login()">Start Playing</button>
    </div>

    <div id="game-ui">
        <h3 id="welcome-msg">Logged in</h3>
        <p>Inventory: <span id="inventory-display">[]</span></p>

        <div id="admin-panel">
            <h4>Owner / Admin Panel</h4>
            <button class="admin-btn" onclick="runGiveAdmin()">Give Admin Privilege</button>
            <button class="admin-btn" onclick="runGetItem()">Get Item (Spawn)</button>
            <button class="admin-btn" onclick="runBanPlayer()">Ban Player</button>
            <button class="admin-btn" onclick="runGetPlayer()">Get Player Data</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = "";

        function login() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) return alert('Enter a username');

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) return alert(data.error);
                currentUser = username;
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('game-ui').style.display = 'flex';
                document.getElementById('welcome-msg').innerText = "Player: " + currentUser;
                
                socket.emit('authenticate', { username });
            });
        }

        socket.on('auth_success', (data) => {
            if (data.isAdmin) {
                document.getElementById('admin-panel').style.display = 'flex';
            }
        });

        socket.on('inventory_updated', (inv) => {
            document.getElementById('inventory-display').innerText = JSON.stringify(inv);
        });

        socket.on('admin_success', (msg) => alert("Success: " + msg));
        socket.on('admin_error', (msg) => alert("Error: " + msg));
        socket.on('admin_player_data', (data) => alert("Player Data:\n" + JSON.stringify(data, null, 2)));
        socket.on('banned_notification', (data) => alert("You have been banned: " + data.reason));

        function runGiveAdmin() {
            const target = prompt("Target Username:");
            if (target) socket.emit('admin_give_admin', { targetUsername: target });
        }

        function runGetItem() {
            const itemId = prompt("Item ID (e.g. speed_boost):");
            const quantity = parseInt(prompt("Quantity:", "1"));
            if (itemId) socket.emit('admin_get_item', { itemId, quantity });
        }

        function runBanPlayer() {
            const target = prompt("Target Username to Ban:");
            const reason = prompt("Reason:");
            if (target) socket.emit('admin_ban_player', { targetUsername: target, reason });
        }

        function runGetPlayer() {
            const target = prompt("Target Username to Fetch:");
            if (target) socket.emit('admin_get_player', { targetUsername: target });
        }
    </script>
</body>
</html>
